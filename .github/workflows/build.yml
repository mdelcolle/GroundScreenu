name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Protocol tests (JVM)
        run: ./tools/jvm-test/run.sh

      - name: ALAC decoder test (bit-exact vs ffmpeg)
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ./tools/jvm-test/alac-test.sh

      - name: Build APK with Gradle
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GroundScreen-apk
          path: app/build/outputs/apk/release/*.apk
